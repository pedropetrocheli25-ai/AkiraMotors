<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
  content="width=device-width, initial-scale=1.0">
<title>Akira Motors - Repuestos Automotrices</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: #f5f5f5;
  color: #333;
  line-height: 1.6;
}
.top-header {
  background: #dc3545;
  color: white;
  padding: 0.5rem 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.6rem;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.header-left {
  display: flex;
  align-items: center;
  gap: 0.8rem;
}
.menu-btn {
  background: none;
  border: none;
  color: white;
  font-size: 1.6rem;
  cursor: pointer;
  padding: 0.2rem;
}
.header-logo {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-size: 1.05rem;
  font-weight: bold;
  cursor: pointer;
}
.header-logo-img {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: white;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.header-logo-img img {
  width: 100%; height: 100%;
  object-fit: cover;
}
.header-right {
  display: flex;
  gap: 0.5rem;
  align-items: center;
}
.header-btn {
  background: rgba(255,255,255,0.15);
  border: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  color: white;
  font-size: 0.68rem;
  padding: 0.25rem 0.6rem;
  border-radius: 8px;
  position: relative;
}
.header-btn .icon { font-size: 1.15rem; }
.cart-badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: #FFC107;
  color: #333;
  border-radius: 50%;
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.68rem;
  font-weight: bold;
}
@keyframes girar {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.screw-loading {
  display: inline-block;
  font-size: 3rem;
  animation: girar 1.5s linear infinite;
}
.verify-banner {
  background: #fff3cd;
  color: #856404;
  border-bottom: 2px solid #ffc107;
  padding: 0.7rem 1rem;
  display: none;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.5rem;
  font-size: 0.85rem;
  position: sticky;
  top: 56px;
  z-index: 99;
}
.verify-banner.active { display: flex; }
.verify-banner button {
  background: #856404;
  color: white;
  border: none;
  padding: 0.4rem 0.8rem;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.8rem;
}
.sidebar-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.5);
  z-index: 1400;
}
.sidebar-overlay.active { display: block; }
.category-sidebar {
  position: fixed;
  left: -360px;
  top: 0;
  width: 340px;
  max-width: 92%;
  height: 100vh;
  background: white;
  z-index: 1500;
  transition: left 0.35s ease;
  overflow-y: auto;
  box-shadow: 2px 0 15px rgba(0,0,0,0.2);
  border-radius: 0 16px 16px 0;
}
.category-sidebar.open { left: 0; }
.sidebar-header {
  background: #dc3545;
  color: white;
  padding: 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-radius: 0 16px 0 0;
  position: sticky;
  top: 0;
  z-index: 5;
}
.sidebar-close {
  background: none;
  border: none;
  color: white;
  font-size: 1.5rem;
  cursor: pointer;
}
.sidebar-search {
  padding: 0.8rem 1rem;
  border-bottom: 1px solid #eee;
}
.sidebar-search input {
  width: 100%;
  padding: 0.6rem 0.8rem;
  border: 2px solid #dc3545;
  border-radius: 20px;
  font-size: 0.9rem;
  outline: none;
}
.drawer-all {
  padding: 0.8rem 1rem;
  cursor: pointer;
  font-weight: 600;
  color: #333;
  border-bottom: 1px solid #f0f0f0;
  font-size: 0.9rem;
}
.drawer-all:hover {
  background: #fff5f5;
  color: #dc3545;
}
.drawer-category {
  border-bottom: 1px solid #f0f0f0;
}
.drawer-cat-header {
  padding: 0.85rem 1rem;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 600;
  color: #333;
  font-size: 0.9rem;
}
.drawer-cat-header:hover {
  background: #fff5f5;
  color: #dc3545;
}
.drawer-cat-header.active {
  background: #dc3545;
  color: white;
}
.drawer-arrow {
  transition: transform 1.5s ease;
  font-size: 1rem;
}
.drawer-cat-header.active .drawer-arrow {
  transform: rotate(180deg);
}
.drawer-brand-list {
  max-height: 0;
  overflow: hidden;
  transition: max-height 1.5s ease;
  background: #fafafa;
}
.drawer-brand-list.open { max-height: 3000px; }
.drawer-brand {
  padding: 0.7rem 1rem 0.7rem 1.4rem;
  cursor: pointer;
  font-weight: 600;
  color: #555;
  font-size: 0.85rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-left: 3px solid transparent;
  background: white;
}
.drawer-brand:hover {
  background: #fff5f5;
  color: #dc3545;
  border-left-color: #dc3545;
}
.drawer-brand .drawer-arrow {
  transition: transform 1.5s ease;
}
.drawer-brand.active .drawer-arrow {
  transform: rotate(180deg);
}
.drawer-model-list {
  max-height: 0;
  overflow: hidden;
  transition: max-height 1.5s ease;
  background: #f5f5f5;
}
.drawer-model-list.open { max-height: 1000px; }
.drawer-model {
  padding: 0.6rem 1rem 0.6rem 2.4rem;
  cursor: pointer;
  font-size: 0.82rem;
  color: #666;
  border-left: 3px solid transparent;
}
.drawer-model:hover {
  background: #fff5f5;
  color: #dc3545;
  border-left-color: #dc3545;
}
.drawer-model.active {
  background: #ffe0e0;
  color: #dc3545;
  font-weight: bold;
  border-left-color: #dc3545;
}
</style>
<style>
.hero-section {
  position: relative;
  min-height: 380px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
}
.hero-bg {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background-size: cover;
  background-position: center;
}
.hero-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}
.hero-content {
  position: relative;
  z-index: 2;
  padding: 2.5rem 1.2rem;
  max-width: 900px;
}
.hero-title {
  font-weight: bold;
  margin-bottom: 0.8rem;
  line-height: 1.2;
}
.hero-subtitle {
  margin-bottom: 1.5rem;
  opacity: 0.95;
}
.hero-cta {
  display: inline-block;
  padding: 0.8rem 1.8rem;
  border-radius: 25px;
  text-decoration: none;
  font-weight: bold;
  transition: transform 0.3s;
  background: #dc3545;
  color: white;
}
.hero-cta:hover { transform: scale(1.05); }
.section {
  padding: 1.8rem 1.2rem;
  max-width: 1400px;
  margin: 0 auto;
}
.section-title {
  font-size: 1.6rem;
  margin-bottom: 0.8rem;
  color: #1a1a1a;
  text-align: center;
}
.section-title .highlight { color: #dc3545; }
.section-subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 1.5rem;
}
.featured-grid {
  display: grid;
  grid-template-columns:
    repeat(auto-fill, minmax(220px, 1fr));
  gap: 1rem;
  justify-items: center;
  align-items: stretch;
}
.featured-card {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  transition: all 0.3s;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 280px;
  height: 100%;
}
.featured-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 25px rgba(220,53,69,0.2);
}
.featured-image {
  width: 100%;
  height: 190px;
  background: #f8f8f8;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  flex-shrink: 0;
}
.featured-image img {
  width: 100%; height: 100%;
  object-fit: contain;
  padding: 12px;
}
.featured-info {
  padding: 0.8rem;
  display: flex;
  flex-direction: column;
  flex: 1;
}
.featured-name {
  font-size: 0.92rem;
  font-weight: 600;
  margin-bottom: 0.4rem;
  color: #333;
  min-height: 2.3rem;
}
.featured-price {
  font-size: 1.2rem;
  color: #dc3545;
  font-weight: bold;
}
.featured-price-bs {
  font-size: 0.8rem;
  color: #666;
}
.featured-price-original {
  font-size: 0.8rem;
  color: #999;
  text-decoration: line-through;
  margin-right: 0.4rem;
}
.offer-tag {
  position: absolute;
  top: 8px; left: 8px;
  background: #dc3545;
  color: white;
  padding: 0.25rem 0.6rem;
  border-radius: 15px;
  font-size: 0.72rem;
  font-weight: bold;
}
.stock-urgent {
  position: absolute;
  bottom: 8px; right: 8px;
  background: #dc3545;
  color: white;
  padding: 0.2rem 0.5rem;
  border-radius: 10px;
  font-size: 0.68rem;
  font-weight: bold;
}
.featured-stock {
  font-size: 0.78rem;
  margin: 0.4rem 0;
}
.featured-stock.in { color: #28a745; }
.featured-stock.low {
  color: #FFC107;
  font-weight: bold;
}
.featured-stock.out { color: #dc3545; }
.featured-add-btn {
  width: 100%;
  background: #dc3545;
  color: white;
  border: none;
  padding: 0.7rem;
  border-radius: 20px;
  cursor: pointer;
  font-weight: 600;
  margin-top: auto;
  font-size: 0.9rem;
}
.featured-add-btn:hover { background: #c82333; }
.featured-add-btn:disabled {
  background: #ccc;
  cursor: not-allowed;
}
</style>
<style>
.modal {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.8);
  z-index: 3000;
  align-items: center;
  justify-content: center;
  padding: 0.8rem;
}
.modal.active { display: flex; }
.modal-content {
  background: white;
  border-radius: 16px;
  max-width: 900px;
  width: 100%;
  max-height: 92vh;
  overflow-y: auto;
  position: relative;
}
.modal-close {
  position: absolute;
  top: 0.8rem; right: 0.8rem;
  background: #dc3545;
  color: white;
  border: none;
  width: 32px; height: 32px;
  border-radius: 50%;
  font-size: 1.1rem;
  cursor: pointer;
  z-index: 10;
}
.product-detail {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
  padding: 1.5rem;
}
.product-detail-image {

  border-radius: 14px;
  display: flex;
  align-items: center;

}
.product-detail-image img {

.product-detail-info h2 {

}
.detail-price-box {

}
.detail-price-usd {

.detail-price-bs {

}
.detail-offer-badge {

.detail-description {

}
.tech-sheet {

}
.tech-sheet h3 {

}
.tech-specs-table {

}
.tech-specs-table tr {

}
.compatibility-table {

}
.compatibility-table th {
  background: #0066cc;
  color: white;
  padding: 0.45rem;
  text-align: left;
  font-size: 0.75rem;
}
.compatibility-table td {
  padding: 0.45rem;
  border-bottom: 1px solid #d0e4f7;
}
.search-terms {
  background: #fff8e1;
  padding: 0.7rem;
  border-radius: 8px;
  margin-top: 0.8rem;
  font-size: 0.78rem;
  color: #666;
}
.search-terms strong { color: #ff9800; }
.detail-actions {
  padding: 1rem 1.5rem;
  border-top: 1px solid #eee;
}
.reviews-section {
  padding: 1.2rem 1.5rem;

.reviews-section h3 {

.review-form .star.active,

.review-form .char-count {

.review-item-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0.4rem;
}
.review-item-stars {
  color: #FFC107;
  font-size: 1rem;

.review-item-text {
  font-size: 0.88rem;
  color: #333;
  margin: 0.3rem 0;
}
.review-item-date {
  font-size: 0.72rem;
  color: #999;

.review-item-user {
  font-weight: 600;
  color: #333;

<style>

  position: fixed;
  right: -500px;
