<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akira Motors - Repuestos Automotrices</title>
<style>
:root {
  --primary: #dc3545;
  --primary-dark: #b51d2a;
  --primary-soft: #fff1f2;
  --ink: #1f2937;
  --muted: #6b7280;
  --line: rgba(15, 23, 42, 0.08);
  --glass: rgba(255,255,255,0.75);
  --shadow-soft: 0 18px 45px rgba(17,24,39,0.08);
  --shadow-strong: 0 28px 80px rgba(17,24,39,0.18);
  --success: #19a974;
  --warning: #f59e0b;
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background:
    radial-gradient(circle at top left, rgba(220,53,69,0.08), transparent 24%),
    linear-gradient(180deg, #f8fafc 0%, #f5f5f5 100%);
  color: var(--ink);
  line-height: 1.6;
}

/* Base modal styling */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  width: 100%; height: 100%;
  background: rgba(17, 24, 39, 0.62);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  z-index: 3000;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.modal.active { display: flex; }
.modal-content {
  background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(255,250,250,0.97) 100%);
  border: 1px solid rgba(255,255,255,0.8);
  border-radius: 26px;
  max-width: 900px;
  width: 100%;
  max-height: 92vh;
  overflow-y: auto;
  position: relative;
  box-shadow: var(--shadow-strong);
}
.modal-close {
  position: absolute;
  top: 0.9rem; right: 0.9rem;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: white;
  border: none;
  width: 34px; height: 34px;
  border-radius: 50%;
  font-size: 1.15rem;
  cursor: pointer;
  z-index: 10;
  box-shadow: 0 12px 24px rgba(220,53,69,0.22);
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}
.modal-close:hover {
  transform: scale(1.04);
  box-shadow: 0 14px 28px rgba(220,53,69,0.28);
}

/* Auth modal premium */
.auth-modal .modal-content {
  max-width: 440px;
  padding: 1.5rem 1.2rem 1.3rem;
  border-radius: 22px;
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
  background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,249,249,0.96));
  border: 1px solid rgba(220,53,69,0.12);
  box-shadow: 0 28px 70px rgba(17,24,39,0.17);
}
.auth-modal h2 {
  color: var(--ink);
  margin: 0 0 0.2rem;
  text-align: center;
  font-size: clamp(1.2rem, 2vw, 1.5rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  padding-right: 2.2rem;
}
.auth-modal p.auth-sub {
  text-align: center;
  color: var(--muted);
  font-size: 0.86rem;
  margin-bottom: 0.4rem;
}

.form-group {
  margin-bottom: 0.82rem;
}
.form-group label {
  display: block;
  margin-bottom: 0.38rem;
  font-weight: 700;
  color: #374151;
  font-size: 0.82rem;
  letter-spacing: 0.01em;
}
.form-group input {
  width: 100%;
  padding: 0.8rem 0.9rem;
  border: 1px solid rgba(148,163,184,0.38);
  border-radius: 14px;
  font-size: 0.92rem;
  background: rgba(255,255,255,0.96);
  color: var(--ink);
  box-shadow: inset 0 1px 2px rgba(15,23,42,0.04);
  transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
}
.form-group input:focus {
  outline: none;
  border-color: rgba(220,53,69,0.8);
  box-shadow: 0 0 0 4px rgba(220,53,69,0.12);
}

.auth-btn {
  width: 100%;
  background: linear-gradient(135deg, #dc3545 0%, #b81d2b 100%);
  color: white;
  border: none;
  padding: 0.82rem 1rem;
  border-radius: 14px;
  font-size: 0.96rem;
  font-weight: 800;
  cursor: pointer;
  margin-top: 0.3rem;
  box-shadow: 0 12px 28px rgba(220,53,69,0.22);
  transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
}
.auth-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 16px 32px rgba(220,53,69,0.26);
  filter: brightness(1.02);
}
.auth-btn:disabled {
  background: #d1d5db;
  box-shadow: none;
  cursor: not-allowed;
}

.guest-btn {
  width: 100%;
  background: #fff;
  color: var(--primary);
  border: 1px solid rgba(220,53,69,0.6);
  padding: 0.78rem 1rem;
  border-radius: 14px;
  font-size: 0.96rem;
  font-weight: 800;
  cursor: pointer;
  margin-top: 0.35rem;
  transition: all 0.2s ease;
}
.guest-btn:hover {
  background: var(--primary-soft);
  border-color: var(--primary);
}

.auth-error {
  color: var(--primary);
  font-size: 0.8rem;
  text-align: center;
  min-height: 1rem;
  margin-top: 0.2rem;
  font-weight: 700;
}

.auth-switch {
  text-align: center;
  margin-top: 0.7rem;
  font-size: 0.84rem;
  color: var(--muted);
}
.auth-switch a {
  color: var(--primary);
  font-weight: 800;
  cursor: pointer;
  text-decoration: none;
}
.auth-switch a:hover { text-decoration: underline; }

/* Checkout modal improvement */
.checkout-modal .modal-content {
  max-width: 460px;
  padding: 1.5rem 1.2rem;
  border-radius: 22px;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  background: linear-gradient(180deg, #ffffff 0%, #fffdfd 100%);
  border: 1px solid rgba(220,53,69,0.08);
  box-shadow: 0 28px 70px rgba(17,24,39,0.16);
}
.checkout-modal h2 {
  text-align: center;
  color: var(--ink);
  font-size: 1.28rem;
  font-weight: 800;
  margin: 0;
  padding-right: 2rem;
}
.checkout-section {
  width: 100%;
}
.checkout-label {
  display: block;
  font-size: 0.82rem;
  font-weight: 700;
  color: #4b5563;
  margin-bottom: 0.5rem;
}
.segmented-control {
  display: flex;
  background: #f3f4f6;
  border-radius: 14px;
  padding: 4px;
  gap: 4px;
  border: 1px solid rgba(148,163,184,0.18);
}
.segmented-option {
  flex: 1;
  padding: 0.7rem 0.4rem;
  text-align: center;
  font-size: 0.84rem;
  font-weight: 700;
  color: #667085;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
}
.segmented-option.active {
  background: white;
  color: var(--ink);
  box-shadow: 0 6px 16px rgba(0,0,0,0.08);
}
.location-card {
  background: linear-gradient(180deg, #fafafa 0%, #ffffff 100%);
  border: 1px solid #ececf0;
  border-radius: 14px;
  padding: 0.9rem;
  margin-top: 0.6rem;
  font-size: 0.85rem;
  color: var(--muted);
  text-align: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
}
.location-card.success {
  background: linear-gradient(180deg, #f1fff7 0%, #ffffff 100%);
  border-color: rgba(25,169,116,0.3);
  color: #0f766e;
  font-weight: 700;
}
.location-card.error {
  background: linear-gradient(180deg, #fff6f6 0%, #ffffff 100%);
  border-color: rgba(220,53,69,0.2);
  color: #b91c1c;
  font-weight: 700;
}
.location-card a {
  display: inline-block;
  margin-top: 0.35rem;
  color: var(--primary);
  font-weight: 700;
  text-decoration: none;
  font-size: 0.85rem;
}
.checkout-totals {
  background: linear-gradient(180deg, #fafafa 0%, #ffffff 100%);
  border: 1px solid #f1f5f9;
  border-radius: 14px;
  padding: 0.9rem;
  font-size: 0.9rem;
}
.checkout-totals .row {
  display: flex;
  justify-content: space-between;
  padding: 0.28rem 0;
  color: #475569;
}
.checkout-totals .row.total {
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--primary);
  border-top: 1px solid rgba(148,163,184,0.25);
  padding-top: 0.6rem;
  margin-top: 0.55rem;
}
.checkout-totals .row.discount {
  color: var(--success);
  font-weight: 700;
}

/* Generic modern buttons */
button, input {
  font: inherit;
}
</style>
</head>
<body>
  <div class="modal auth-modal active" aria-modal="true" role="dialog">
    <div class="modal-content">
      <button class="modal-close" aria-label="Cerrar">×</button>
      <h2>Iniciar sesión</h2>
      <p class="auth-sub">Accede para continuar con tu compra</p>

      <div class="form-group">
        <label for="email">Correo</label>
        <input id="email" type="email" placeholder="tucorreo@email.com" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="••••••••" />
      </div>

      <button class="auth-btn">Entrar</button>
      <button class="guest-btn">Continuar como invitado</button>
      <div class="auth-error"> </div>

      <div class="auth-switch">
        ¿No tienes cuenta? <a href="#">Crear cuenta</a>
      </div>
    </div>
  </div>
</body>
</html>
