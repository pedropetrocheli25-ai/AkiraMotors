<script type="module">
import { initializeApp, getApps, getApp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, doc, getDoc
}
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAU77yzh7Tm3RPuuvVcxlCt26u2ljmsBK0",
  authDomain: "akiramotors-cc498.firebaseapp.com",
  projectId: "akiramotors-cc498",
  storageBucket: "akiramotors-cc498.firebasestorage.app",
  messagingSenderId: "657064466850",
  appId: "1:657064466850:web:2d1340db67f790d11ebafb"
};

const app = getApps().length > 0
  ? getApp()
  : initializeApp(firebaseConfig);
const db = getFirestore(app);

// ============================================================
// UTILIDADES
// ============================================================
function escapeHTML(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// Extrae el ID de un video de YouTube desde varias formas de URL
function extraerYouTubeId(url) {
  if (!url) return null;
  var u = String(url).trim();
  // youtube.com/watch?v=XXXX o youtube.com/watch?feature=...&v=XXXX
  var m1 = u.match(/[?&]v=([a-zA-Z0-9_-]{6,20})/);
  if (m1) return m1[1];
  // youtu.be/XXXX
  var m2 = u.match(/youtu\.be\/([a-zA-Z0-9_-]{6,20})/);
  if (m2) return m2[1];
  // youtube.com/embed/XXXX
  var m3 = u.match(/youtube\.com\/embed\/([a-zA-Z0-9_-]{6,20})/);
  if (m3) return m3[1];
  // youtube.com/shorts/XXXX
  var m4 = u.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]{6,20})/);
  if (m4) return m4[1];
  return null;
}

// Valida URL de embed de Google Maps
function esMapsEmbedValido(url) {
  if (!url) return false;
  var u = String(url).trim();
  return u.indexOf('https://www.google.com/maps/embed') === 0;
}

// ============================================================
// CARGA PRINCIPAL
// ============================================================
async function cargarPagina() {
  try {
    // ------------------------------------------------------
    // 1. Cargar configuraciones en paralelo
    // ------------------------------------------------------
    var promesas = await Promise.allSettled([
      getDoc(doc(db, 'settings', 'aboutUs')),
      getDoc(doc(db, 'settings', 'siteConfig')),
      getDoc(doc(db, 'settings', 'whatsapp')),
      getDoc(doc(db, 'settings', 'logo'))
    ]);

    var aboutUs = promesas[0].status === 'fulfilled'
      && promesas[0].value.exists
      ? promesas[0].value.data() : {};
    var siteConfig = promesas[1].status === 'fulfilled'
      && promesas[1].value.exists
      ? promesas[1].value.data() : {};
    var whatsappData = promesas[2].status === 'fulfilled'
      && promesas[2].value.exists
      ? promesas[2].value.data() : {};
    var logoData = promesas[3].status === 'fulfilled'
      && promesas[3].value.exists
      ? promesas[3].value.data() : {};

    var whatsappNumber = whatsappData.number || '584148700616';
    var companyName = siteConfig.companyName || 'AKIRA MOTORS';

    // ------------------------------------------------------
    // 2. Aplicar logo y nombre en el header
    // ------------------------------------------------------
    var headerNameEl = document.getElementById('headerCompanyName');
    if (headerNameEl) headerNameEl.textContent = companyName;
    if (logoData.image) {
      var logoImgEl = document.getElementById('headerLogoImg');
      if (logoImgEl) {
        logoImgEl.innerHTML = '<img src="' +
          escapeHTML(logoData.image) + '" alt="Logo">';
      }
    }
    document.title = 'Quiénes Somos - ' + companyName;

    // ------------------------------------------------------
    // 3. Hero
    // ------------------------------------------------------
    if (aboutUs.title) {
      var heroSection = document.getElementById('heroSection');
      var heroTitle = document.getElementById('heroTitle');
      if (heroSection && heroTitle) {
        heroTitle.innerHTML = escapeHTML(aboutUs.title)
          .replace(/Akira Motors/gi,
            '<span>Akira Motors</span>');
        if (aboutUs.text) {
          var texto = aboutUs.text;
          if (texto.length > 160) {
            texto = texto.substring(0, 160) + '...';
          }
          var heroSubtitle = document.getElementById('heroSubtitle');
          if (heroSubtitle) heroSubtitle.textContent = texto;
        }
        heroSection.style.display = 'block';
      }
    }

    // ------------------------------------------------------
    // 4. Bloque "Quiénes Somos"
    // ------------------------------------------------------
    if (aboutUs.text) {
      var aboutBlock = document.getElementById('aboutBlock');
      var aboutTextEl = document.getElementById('aboutText');
      if (aboutBlock && aboutTextEl) {
        aboutTextEl.textContent = aboutUs.text;
        aboutBlock.style.display = 'block';
      }
    }

    // ------------------------------------------------------
    // 5. Misión y Visión
    // ------------------------------------------------------
    var mvBlock = document.getElementById('mvBlock');
    var hayMV = false;

    if (aboutUs.mission) {
      var mc = document.getElementById('missionCard');
      var mt = document.getElementById('missionText');
      if (mc && mt) {
        mt.textContent = aboutUs.mission;
        mc.style.display = 'block';
        hayMV = true;
      }
    }
    if (aboutUs.vision) {
      var vc = document.getElementById('visionCard');
      var vt = document.getElementById('visionText');
      if (vc && vt) {
        vt.textContent = aboutUs.vision;
        vc.style.display = 'block';
        hayMV = true;
      }
    }
    if (hayMV && mvBlock) {
      mvBlock.style.display = 'block';
    }

    // ------------------------------------------------------
    // 6. Media (video o imagen del local)
    // ------------------------------------------------------
    var mediaBlock = document.getElementById('mediaBlock');
    var mediaContainer = document.getElementById('mediaContainer');
    var ytId = extraerYouTubeId(aboutUs.videoUrl);

    if (ytId) {
      // Video de YouTube con nocookie
      mediaContainer.innerHTML =
        '<div class="media-frame video">' +
        '<iframe src="https://www.youtube-nocookie.com/embed/' +
        encodeURIComponent(ytId) + '" ' +
        'title="Video del local" ' +
        'allow="accelerometer; autoplay; clipboard-write; ' +
        'encrypted-media; gyroscope; picture-in-picture" ' +
        'allowfullscreen loading="lazy"></iframe>' +
        '</div>';
      mediaBlock.style.display = 'block';
    } else if (aboutUs.image) {
      // Imagen del local
      mediaContainer.innerHTML =
        '<div class="media-frame">' +
        '<img src="' + escapeHTML(aboutUs.image) +
        '" alt="Foto de nuestro local" loading="lazy">' +
        '</div>';
      mediaBlock.style.display = 'block';
    }

    // ------------------------------------------------------
    // 7. Google Maps (solo si es URL válida de embed)
    // ------------------------------------------------------
    if (esMapsEmbedValido(aboutUs.mapsEmbed)) {
      var mapsBlock = document.getElementById('mapsBlock');
      var mapsContainer = document.getElementById('mapsContainer');
      if (mapsBlock && mapsContainer) {
        mapsContainer.innerHTML =
          '<iframe src="' +
          escapeHTML(aboutUs.mapsEmbed) + '" ' +
          'title="Ubicación de la tienda" ' +
          'allowfullscreen loading="lazy" ' +
          'referrerpolicy="no-referrer-when-downgrade">' +
          '</iframe>';
        mapsBlock.style.display = 'block';
      }
    }

    // ------------------------------------------------------
    // 8. Footer
    // ------------------------------------------------------
    renderFooter(siteConfig);

    // ------------------------------------------------------
    // 9. WhatsApp flotante
    // ------------------------------------------------------
    var cleanWhats = String(whatsappNumber).replace(/\D/g, '');
    var floatBtn = document.getElementById('whatsappFloat');
    if (floatBtn) {
      floatBtn.href = 'https://wa.me/' + cleanWhats +
        '?text=' + encodeURIComponent(
          'Hola, tengo una consulta sobre repuestos.'
        );
    }

    // ------------------------------------------------------
    // 10. Mostrar contenido y ocultar loading
    // ------------------------------------------------------
    var loading = document.getElementById('loadingBlock');
    var content = document.getElementById('content');
    if (loading) loading.style.display = 'none';
    if (content) content.style.display = 'block';

    // Si no hay aboutUs, avisar visualmente
    if (!aboutUs.title && !aboutUs.text &&
        !aboutUs.mission && !aboutUs.vision) {
      var fallback = document.getElementById('aboutBlock');
      if (fallback) {
        fallback.innerHTML =
          '<div class="section-header">' +
          '<h2 class="section-title">' +
          'Información <span>próximamente</span></h2>' +
          '</div>' +
          '<div class="about-content" ' +
          'style="text-align:center;">' +
          'Aún estamos preparando esta sección. ' +
          'Visita nuestra tienda mientras tanto.' +
          '</div>';
        fallback.style.display = 'block';
      }
    }
  } catch (error) {
    console.error('Error cargando página:', error);
    var loading = document.getElementById('loadingBlock');
    if (loading) {
      loading.innerHTML = '<div style="color:#DC3545;">' +
        'No se pudo cargar la información.<br>' +
        'Recarga la página o escríbenos por WhatsApp.' +
        '</div>';
    }
  }
}

// ============================================================
// FOOTER (mismo formato que index)
// ============================================================
function renderFooter(sc) {
  var html = '';
  html += '<div class="footer-section">';
  html += '<h3>' + escapeHTML(sc.companyName || 'AKIRA MOTORS') +
    '</h3>';
  html += '<p>' + escapeHTML(sc.description || '') + '</p>';
  html += '</div>';

  html += '<div class="footer-section">';
  html += '<h3>Contacto</h3>';
  if (sc.address) {
    html += '<p>' + escapeHTML(sc.address) + '</p>';
  }
  if (sc.phone) {
    html += '<p>' + escapeHTML(sc.phone) + '</p>';
  }
  html += '</div>';

  html += '<div class="footer-section">';
  html += '<h3>Horario</h3>';
  html += '<p>' + escapeHTML(sc.schedule || '') + '</p>';
  html += '</div>';

  html += '<div class="footer-section">';
  html += '<h3>Síguenos</h3>';
  if (sc.facebook) {
    html += '<a href="' + escapeHTML(sc.facebook) +
      '" target="_blank" rel="noopener">Facebook</a>';
  }
  if (sc.instagram) {
    html += '<a href="' + escapeHTML(sc.instagram) +
      '" target="_blank" rel="noopener">Instagram</a>';
  }
  if (sc.tiktok) {
    html += '<a href="' + escapeHTML(sc.tiktok) +
      '" target="_blank" rel="noopener">TikTok</a>';
  }
  html += '</div>';

  var fc = document.getElementById('footerContent');
  if (fc) fc.innerHTML = html;

  var fb = document.getElementById('footerBottom');
  if (fb) {
    fb.innerHTML = '<p>&copy; ' + new Date().getFullYear() +
      ' ' + escapeHTML(sc.companyName || 'AKIRA MOTORS') +
      ' · Todos los derechos reservados · ' +
      '<a href="index.html" style="color:#FF6B1A;' +
      'text-decoration:underline;">Volver a la tienda</a>' +
      '</p>';
  }
}

// ============================================================
// INICIAR
// ============================================================
cargarPagina();
</script>
